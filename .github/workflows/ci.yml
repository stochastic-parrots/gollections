name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-target:
    name: Pull request target
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branches
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$PR_BASE" == develop ]]; then
            exit 0
          fi
          if [[ "$PR_BASE" == main && "$PR_HEAD_REPOSITORY" == "$REPOSITORY" && ( "$PR_HEAD" == develop || "$PR_HEAD" == release/* ) ]]; then
            exit 0
          fi
          echo "Change PRs must target develop. Only develop or release/* from this repository may target main."
          exit 1

  build:
    name: Build and test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: 1.24.x
            coverage: true
          - go-version: stable
            coverage: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Test
        if: ${{ !matrix.coverage }}
        run: go test -race ./...
      - name: Test and collect library coverage
        if: ${{ matrix.coverage }}
        run: |
          go test -race -covermode=atomic -coverprofile=coverage-all.out ./...
          awk 'NR == 1 || $1 !~ /\/internal\/benchmarks\//' coverage-all.out > coverage.out
          go tool cover -func=coverage.out
          awk 'NR > 1 { total += $2; if ($3 > 0) covered += $2 }
            END {
              if (total == 0) { print "No library coverage statements found"; exit 1 }
              printf "Library coverage: %.2f%% (required: 95%%)\n", 100 * covered / total
              if (100 * covered < 95 * total) exit 1
            }' coverage.out
      - name: Save library coverage
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: library-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Test release automation
        run: bash .github/scripts/test-release.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
          cache-dependency-path: go.sum
      - name: Lint all packages and enforce import rules
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
          args: --timeout=5m ./...

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download library coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name library-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.out
          use_oidc: true
