name: Promote develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pull-request:
    name: Open or update release pull request
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update develop to main pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...develop" --jq '.ahead_by')"
          if [[ "$ahead_by" == "0" ]]; then
            echo "develop has no commits ahead of main."
            exit 0
          fi

          pull_request="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'chore(release): promote develop to main' \
              --body 'Automated release promotion. Review the changes and CI checks before merging.'
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head develop \
              --title 'chore(release): promote develop to main' \
              --body 'Automated release promotion. Review the changes and CI checks before merging.'
          fi
