name: Pull request policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  policy:
    name: Validate trusted pull request policy
    runs-on: ubuntu-latest
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mark policy validation pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending -f context='Pull request target' \
            -f description='Validating trusted branch and release policy' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check out trusted policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read proposed module as data
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/go.mod" \
            -H 'Accept: application/vnd.github.raw+json' -f ref="$PR_HEAD_SHA" \
            > "$RUNNER_TEMP/pr-go.mod"
      - name: Validate pull request policy
        id: validate
        run: |
          bash .github/scripts/release.sh check "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/pr-go.mod"
      - name: Report required policy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          state=failure
          if [[ "$VALIDATION_OUTCOME" == success ]]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$state" -f context='Pull request target' \
            -f description='Trusted branch and release policy validation' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
