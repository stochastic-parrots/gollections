name: Publish release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged release pull request number (retry only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  tag:
    name: Publish merged release
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Read merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pull request number"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          bash .github/scripts/release.sh publish "$RUNNER_TEMP/release-pr.json" "$GITHUB_REPOSITORY"
